# Ambiente completo (build de produção): banco + API + frontend (Nginx)
#   docker compose up -d --build
# Acesse http://localhost:3001
# Variáveis opcionais: copie .env.example para .env e ajuste.

services:
  db:
    image: postgres:17
    container_name: horto-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-horto}
      TZ: America/Sao_Paulo
    ports:
      - "${DB_PORT_HOST:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: prod
    container_name: horto-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-horto}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-horto-dev-secret-troque-em-producao}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      PORT: 3002
      TZ: America/Sao_Paulo
    ports:
      - "${API_PORT_HOST:-3002}:3002"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: prod
    container_name: horto-frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT_HOST:-3001}:80"
    depends_on:
      - backend

volumes:
  pgdata:
